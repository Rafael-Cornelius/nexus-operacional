services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexus}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatoria; gere um segredo aleatorio com pelo menos 32 caracteres}"
      POSTGRES_DB: ${POSTGRES_DB:-nexus_operacional}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nexus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexus} -d ${POSTGRES_DB:-nexus_operacional}"]
      interval: 10s
      timeout: 5s
      retries: 8

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: ${API_PORT:-3333}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-nexus}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatoria}@postgres:5432/${POSTGRES_DB:-nexus_operacional}?schema=public"
      JWT_ACCESS_SECRET: "${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET obrigatoria; gere um segredo aleatorio com pelo menos 32 caracteres}"
      WEB_ORIGIN: "${WEB_ORIGIN:?WEB_ORIGIN obrigatoria; use a origem HTTPS publica sem caminho}"
      BACKUP_DIR: ${BACKUP_DIR:-./backups}
      BACKUP_EXTERNAL_DIR: /app/backups-external
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:?BACKUP_ENCRYPTION_KEY obrigatoria}
      BACKUP_ENCRYPTION_KEY_ID: ${BACKUP_ENCRYPTION_KEY_ID:-primary}
      BACKUP_SCHEDULE_ENABLED: ${BACKUP_SCHEDULE_ENABLED:-true}
      BACKUP_RETENTION_COUNT: ${BACKUP_RETENTION_COUNT:-30}
      BACKUP_MAX_VERIFY_BYTES: ${BACKUP_MAX_VERIFY_BYTES:-536870912}
      BACKUP_COMMAND_TIMEOUT_MS: ${BACKUP_COMMAND_TIMEOUT_MS:-900000}
      IMPORT_UPLOAD_DIR: ${IMPORT_UPLOAD_DIR:-./uploads/imports}
      IMPORT_MAX_UPLOAD_BYTES: ${IMPORT_MAX_UPLOAD_BYTES:-26214400}
      PYTHON_BIN: ${PYTHON_BIN:-python3}
    ports:
      - "127.0.0.1:${API_PORT:-3333}:3333"
    volumes:
      - nexus-backups:/app/backups
      - nexus-imports:/app/uploads
      - type: bind
        source: "${BACKUP_EXTERNAL_HOST_DIR:?BACKUP_EXTERNAL_HOST_DIR obrigatorio; informe diretorio existente e gravavel no host}"
        target: /app/backups-external
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3333/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 8

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3333}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:3333}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 8

volumes:
  nexus-postgres-data:
  nexus-backups:
  nexus-imports:
