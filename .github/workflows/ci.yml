name: Validate operational application

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_operacional
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_operacional"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_operacional?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-at-least-32-characters
      NEXT_PUBLIC_DEMO_MODE: "false"
      API_INTERNAL_URL: http://127.0.0.1:3333
      INITIAL_ADMIN_EMAIL: e2e-admin@nexus.local
      INITIAL_ADMIN_PASSWORD: E2e-Nexus-Only-2026!
      BACKUP_ENCRYPTION_KEY: 9d44c8e30fe4690548d514b9bcfac9792335f05576bd2301b5236a2169d83df1
      BACKUP_ENCRYPTION_KEY_ID: ci-restore-proof
      BACKUP_SCHEDULE_ENABLED: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject high or critical dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Prove workflow migration upgrades closed historical rows
        env:
          MIGRATION_UPGRADE_DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_migration_upgrade
        run: |
          PGPASSWORD=nexus psql -h localhost -U nexus -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE nexus_migration_upgrade'
          bash scripts/prove_workflow_migration_upgrade.sh

      - name: Apply database migrations to a clean PostgreSQL instance
        run: npm run prisma:deploy

      - name: Bootstrap clean operational database
        run: |
          npm run prisma:seed
          npm run bootstrap:assert-clean

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end preview flows
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_DEMO_ADMIN_EMAIL: "admin@demo.nexus.local"
          NEXT_PUBLIC_DEMO_ADMIN_PASSWORD: "NexusDemo@2026"

      - name: End-to-end operational API and PostgreSQL flow
        run: npx playwright test --config=playwright.operational.config.ts

      - name: Prove encrypted backup restore in a separate PostgreSQL database
        env:
          BACKUP_DIR: /tmp/nexus-backup-proof
          RESTORE_DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_restore_proof?schema=public
          RESTORE_DATABASE_EXPECTED_NAME: nexus_restore_proof
          RESTORE_CONFIRMATION: RESTORE_TO_EMPTY_DATABASE:nexus_restore_proof
        run: |
          PGPASSWORD=nexus psql -h localhost -U nexus -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE nexus_restore_proof'
          backup_json="$(npm run --silent backup:create:snapshot)"
          backup_path="$(jq -er '.filePath' <<<"$backup_json")"
          backup_sha256="$(jq -er '.checksum' <<<"$backup_json")"
          RESTORE_BACKUP_SHA256="$backup_sha256" npm run backup:restore:prove -- --file "$backup_path"

      - name: Build operational API and web application
        run: npm run build

  production-container-smoke:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: 8f4b31bb8d65e721ddc0a197c16b6cb98df99ad40cf381a57667789a91d56c36
      POSTGRES_DB: nexus_operacional
      JWT_ACCESS_SECRET: ci-container-access-secret-with-at-least-32-characters
      INITIAL_ADMIN_EMAIL: container-admin@nexus.local
      INITIAL_ADMIN_PASSWORD: Container-E2e-Only-2026!
      INITIAL_ADMIN_NAME: Administrador CI
      BACKUP_ENCRYPTION_KEY: 2d37be133ceb98f538b009f5fa94f93b9a36cbf08317b03703ba93076ec1febe
      BACKUP_ENCRYPTION_KEY_ID: ci-container-restore-proof
      BACKUP_EXTERNAL_HOST_DIR: /tmp/nexus-backups-external-ci
      BACKUP_SCHEDULE_ENABLED: "false"
      WEB_ORIGIN: http://127.0.0.1:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare external backup bind mount
        run: sudo install -d -m 0700 -o 1000 -g 1000 "$BACKUP_EXTERNAL_HOST_DIR"

      - name: Validate production Compose configuration
        run: docker compose config --quiet

      - name: Build production images
        run: docker compose build api web

      - name: Start PostgreSQL before application containers
        run: docker compose up -d --wait --wait-timeout 120 postgres

      - name: Apply migrations and clean bootstrap with one-off API containers
        run: |
          docker compose run --rm -T api npm run prisma:deploy
          docker compose run --rm -T -e INITIAL_ADMIN_EMAIL -e INITIAL_ADMIN_PASSWORD -e INITIAL_ADMIN_NAME api npm run prisma:seed
          docker compose run --rm -T -e INITIAL_ADMIN_EMAIL api npm run bootstrap:assert-clean

      - name: Prove native backup restore with the production API image
        run: |
          docker compose run --rm -T api sh -ec 'pg_dump --version | grep -Eq "^pg_dump \(PostgreSQL\) 16\."; pg_restore --version | grep -Eq "^pg_restore \(PostgreSQL\) 16\."'
          docker compose exec -T postgres psql --username "$POSTGRES_USER" --dbname postgres --set ON_ERROR_STOP=1 --command 'CREATE DATABASE nexus_restore_container_proof'
          backup_json="$(docker compose run --rm -T api npm run --silent backup:create:snapshot)"
          backup_path="$(jq -er '.filePath' <<<"$backup_json")"
          backup_sha256="$(jq -er '.checksum' <<<"$backup_json")"
          backup_name="$(basename "$backup_path")"
          docker compose run --rm -T \
            -e EXPECTED_BACKUP_SHA256="$backup_sha256" \
            -e EXTERNAL_BACKUP_PATH="/app/backups-external/$backup_name" \
            api sh -ec 'test -s "$EXTERNAL_BACKUP_PATH"; printf "%s  %s\n" "$EXPECTED_BACKUP_SHA256" "$EXTERNAL_BACKUP_PATH" | sha256sum -c'
          docker compose run --rm -T \
            -e RESTORE_DATABASE_URL="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/nexus_restore_container_proof?schema=public" \
            -e RESTORE_DATABASE_EXPECTED_NAME=nexus_restore_container_proof \
            -e RESTORE_CONFIRMATION=RESTORE_TO_EMPTY_DATABASE:nexus_restore_container_proof \
            -e RESTORE_BACKUP_SHA256="$backup_sha256" \
            -e RESTORE_BACKUP_KEY_ID="$BACKUP_ENCRYPTION_KEY_ID" \
            api npm run backup:restore:prove -- --file "$backup_path"

      - name: Start API and web only after the schema is current
        run: docker compose up -d --wait --wait-timeout 120 api web

      - name: Verify production health
        run: |
          curl --fail --retry 12 --retry-connrefused --retry-delay 5 http://127.0.0.1:3000/api/health
          curl --fail --retry 12 --retry-connrefused --retry-delay 5 http://127.0.0.1:3000/login

      - name: Verify login, RBAC and same-origin proxy in production images
        run: |
          curl --fail --silent --show-error \
            --header 'Content-Type: application/json' \
            --header "Origin: $WEB_ORIGIN" \
            --cookie-jar /tmp/nexus-ci.cookies \
            --output /tmp/nexus-ci-login.json \
            --data "{\"email\":\"$INITIAL_ADMIN_EMAIL\",\"password\":\"$INITIAL_ADMIN_PASSWORD\"}" \
            http://127.0.0.1:3000/api/auth/login
          jq --exit-status --arg email "$INITIAL_ADMIN_EMAIL" \
            '.user.email == ($email | ascii_downcase) and (.user.roles | index("ADMIN") != null)' \
            /tmp/nexus-ci-login.json
          session_cookie="$(awk '$6 == "nexus_session" { print $7 }' /tmp/nexus-ci.cookies)"
          test -n "$session_cookie"
          curl --fail --silent --show-error \
            --header "Cookie: nexus_session=$session_cookie" \
            http://127.0.0.1:3000/api/auth/me \
            | jq --exit-status --arg email "$INITIAL_ADMIN_EMAIL" \
              '.user.email == ($email | ascii_downcase) and (.user.roles | index("ADMIN") != null)'
          curl --fail --silent --show-error \
            --request POST \
            --header "Origin: $WEB_ORIGIN" \
            --header "Cookie: nexus_session=$session_cookie" \
            http://127.0.0.1:3000/api/auth/logout \
            | jq --exit-status '.ok == true'

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Remove disposable containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans
