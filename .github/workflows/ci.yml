name: Validate operational application

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
          POSTGRES_DB: nexus_operacional
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_operacional"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://nexus:nexus@localhost:5432/nexus_operacional?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-with-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-with-at-least-32-characters
      NEXT_PUBLIC_DEMO_MODE: "false"
      API_INTERNAL_URL: http://127.0.0.1:3333

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject high or critical dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply database migrations to a clean PostgreSQL instance
        run: npm run prisma:deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end preview flows
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_DEMO_ADMIN_EMAIL: "admin@demo.nexus.local"
          NEXT_PUBLIC_DEMO_ADMIN_PASSWORD: "NexusDemo@2026"

      - name: Build operational API and web application
        run: npm run build
